<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Quickland CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-sm w-full bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto text-2xl text-white shadow-lg shadow-blue-500/40">
        <i class="fa-solid fa-satellite-dish"></i>
      </div>
      <h1 class="text-2xl font-black tracking-wide text-white">Quickland CRM</h1>
      <p class="text-xs text-slate-400">Ingresa tus credenciales para continuar</p>
    </div>

    <form onsubmit="iniciarSesion(event)" class="space-y-4 text-sm">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Usuario</label>
        <div class="relative">
          <input type="text" id="inputUsuario" required placeholder="Ej. BYalico" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 pl-9 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
          <i class="fa-solid fa-user absolute left-3 top-3.5 text-slate-500 text-xs"></i>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Contraseña</label>
        <div class="relative">
          <input type="password" id="inputPassword" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 pl-9 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
          <i class="fa-solid fa-lock absolute left-3 top-3.5 text-slate-500 text-xs"></i>
        </div>
      </div>

      <div id="mensajeError" class="hidden text-xs text-rose-400 bg-rose-950/40 border border-rose-800 p-2.5 rounded-xl text-center"></div>

      <button type="submit" id="btnIngresar" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg shadow-blue-600/30 transition flex items-center justify-center space-x-2">
        <span>Ingresar al Sistema</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="text-[11px] text-center text-slate-500 pt-2 border-t border-slate-700">
      Quickland Telecomunicaciones &copy; 2026
    </div>
  </div>

  <script>
    async function iniciarSesion(e) {
      e.preventDefault();
      const btn = document.getElementById('btnIngresar');
      const errBox = document.getElementById('mensajeError');
      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Verificando...';

      const payload = {
        usuario: document.getElementById('inputUsuario').value,
        password: document.getElementById('inputPassword').value
      };

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.status === 'success') {
          window.location.href = data.redirect;
        } else {
          errBox.innerText = data.message;
          errBox.classList.remove('hidden');
        }
      } catch (err) {
        errBox.innerText = 'Error al comunicarse con el servidor.';
        errBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Ingresar al Sistema</span> <i class="fa-solid fa-arrow-right ml-1"></i>';
      }
    }
  </script>
</body>
</html>
